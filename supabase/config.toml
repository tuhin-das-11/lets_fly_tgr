# ==============================================================================
# Supabase Local Development & Deployment Configuration
# Project: LET'S FLY TGR
# ==============================================================================

[api]
enabled = true
port = 54321
schemas = ["public", "auth", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["letsflytgr://auth-callback", "http://localhost:54321/auth/v1/callback"]
jwt_expiry = 3600
enable_signup = true

[realtime]
enabled = true
ip_version = "IPv4"
max_header_length = 4096

[storage]
enabled = true
file_size_limit = "10MiB"
